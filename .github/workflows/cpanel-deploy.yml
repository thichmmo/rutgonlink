name: Test and Deploy cPanel

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpanel-production
  cancel-in-progress: false

jobs:
  test-build:
    name: Test and package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Prisma schema
        run: pnpm exec prisma validate
        env:
          DATABASE_URL: mysql://build:build@127.0.0.1:3306/build

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Typecheck
        run: pnpm exec tsc --noEmit --pretty false

      - name: Popup runtime regressions
        run: node scripts/test-popup-runtime.cjs

      - name: Popup click analytics regressions
        run: node scripts/test-popup-clicks.cjs

      - name: Popup affiliate URL regressions
        run: node scripts/test-popup-affiliate.cjs

      - name: Telegram template regressions
        run: |
          node scripts/test-telegram-api.cjs
          node scripts/test-telegram-render.cjs
          node scripts/test-telegram-dashboard.cjs
          node scripts/test-telegram-quick-form.cjs

      - name: Numeric post links and video removal regressions
        run: |
          node scripts/test-numeric-post-links.cjs
          node scripts/test-rich-editor-video.cjs
          node scripts/test-telegram-media-removal.cjs

      - name: Admin daily popup click regressions
        run: |
          node scripts/test-admin-popup-clicks.cjs
          node scripts/test-admin-popup-clicks-ui.cjs

      - name: Article video resolution regressions
        run: |
          node scripts/test-article-video.cjs
          node scripts/test-article-video-ui.cjs
          node scripts/test-content-media.cjs

      - name: Fixed content composer regressions
        run: node scripts/test-fixed-content-composer.cjs

      - name: Post type separation regressions
        run: |
          node scripts/test-post-types-api.cjs
          node scripts/test-post-types-dashboard.cjs

      - name: Popup timing dashboard regressions
        run: |
          node scripts/test-popup-timing.cjs
          node scripts/test-popup-timing-api.cjs

      - name: Content upload regressions
        run: |
          node scripts/test-content-upload-path.cjs
          node scripts/test-content-upload.cjs
          node scripts/test-rich-editor-upload.cjs

      - name: Lint
        run: >-
          pnpm exec eslint
          app/api/popups app/api/posts app/api/content-blocks app/api/content
          app/dashboard/popups app/dashboard/posts
          app/dashboard/popup-timing.ts app/dashboard/PopupTiming.tsx
          'app/posts/[slug]' 'app/[shortCode]/route.ts'
          lib/content-management.ts lib/popup-settings.ts lib/popup-settings-server.ts lib/popup-link.ts lib/popup-browser-gate.ts lib/public-post-guard.ts
          lib/popup-affiliate-url.ts lib/tiktok-link.ts scripts/test-popup-affiliate.cjs
          app/dashboard/DashboardNavLinks.tsx app/dashboard/MobileNav.tsx
          scripts/package-cpanel.mjs scripts/test-popup-runtime.cjs scripts/test-content-upload-path.cjs
          next.config.ts scripts/test-content-upload.cjs scripts/test-rich-editor-upload.cjs
          scripts/test-popup-timing.cjs scripts/test-popup-timing-api.cjs
          app/api/popup-clicks app/api/popup-stats
          app/dashboard/PopupClickStats.tsx app/dashboard/PopupAnalytics.tsx
          lib/popup-click-client.ts lib/popup-click-token.ts
          lib/popup-analytics.ts lib/popup-analytics-server.ts scripts/test-popup-clicks.cjs
          lib/telegram-settings.ts lib/telegram-render.ts
          app/api/settings/telegram app/dashboard/settings/TelegramSettingsSection.tsx
          app/dashboard/settings/TelegramSettingsFields.tsx app/chinh-sach-bao-mat
          scripts/test-telegram-api.cjs scripts/test-telegram-render.cjs scripts/test-telegram-dashboard.cjs
          scripts/test-telegram-quick-form.cjs
          scripts/test-numeric-post-links.cjs scripts/test-rich-editor-video.cjs
          scripts/test-telegram-media-removal.cjs
          app/api/admin/users app/admin/users lib/admin-popup-clicks.ts
          scripts/test-admin-popup-clicks.cjs scripts/test-admin-popup-clicks-ui.cjs
          lib/article-video.ts scripts/test-article-video.cjs scripts/test-article-video-ui.cjs
          scripts/test-content-media.cjs
          'app/p7/[code]' lib/public-post-link.ts lib/numeric-post-link-server.ts
          scripts/test-fixed-content-composer.cjs
          scripts/test-post-types-api.cjs scripts/test-post-types-dashboard.cjs

      - name: Validate deployment scripts
        run: |
          bash -n scripts/cpanel-release.sh
          bash -n scripts/cpanel-deploy.sh

      - name: Build cPanel standalone
        run: pnpm build:cpanel
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          DATABASE_URL: mysql://build:build@127.0.0.1:3306/build
          NEXTAUTH_URL: https://rutgonlink.site
          SITE_NAME: rutgonlink.site
          NEXTAUTH_SECRET: ci-build-placeholder
          ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef

      - name: Package release
        run: |
          node scripts/package-cpanel.mjs
          tar -C .artifacts/cpanel/release -czf "$RUNNER_TEMP/rutgonlink-cpanel-${GITHUB_SHA}.tar.gz" .

      - name: Preflight packaged Linux runtime
        run: |
          cd .artifacts/cpanel/release/.next/standalone
          NODE_PATH="$PWD/node_modules/.pnpm/node_modules" node -e "for (const p of ['next', '@prisma/client', 'nanoid/non-secure']) require.resolve(p)"
          PORT=3012 HOSTNAME=127.0.0.1 NODE_ENV=production NODE_PATH="$PWD/node_modules/.pnpm/node_modules" node server.js > "$RUNNER_TEMP/preflight.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; cat "$RUNNER_TEMP/preflight.log"' EXIT
          for attempt in $(seq 1 30); do
            root_status="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 4 -H 'Host: rutgonlink.site' http://127.0.0.1:3012/ || true)"
            popups_status="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 4 -H 'Host: rutgonlink.site' http://127.0.0.1:3012/api/popups || true)"
            posts_status="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 4 -H 'Host: rutgonlink.site' http://127.0.0.1:3012/api/posts || true)"
            video_status="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 4 --request POST --header 'Content-Type: application/json' --data '{"url":"https://example.com/article"}' -H 'Host: rutgonlink.site' http://127.0.0.1:3012/api/content/resolve-video || true)"
            upload_status="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 4 --request POST --data 'upload-auth-probe' -H 'Host: rutgonlink.site' http://127.0.0.1:3012/api/content/upload || true)"
            if [ "$root_status" = 200 ] && [ "$popups_status" = 401 ] && [ "$posts_status" = 401 ] && [ "$video_status" = 401 ] && [ "$upload_status" = 401 ]; then exit 0; fi
            sleep 2
          done
          echo "Preflight failed: root=$root_status popups=$popups_status posts=$posts_status video=$video_status upload=$upload_status" >&2
          exit 1
        env:
          DATABASE_URL: mysql://build:build@127.0.0.1:3306/build
          NEXTAUTH_URL: https://rutgonlink.site
          SITE_NAME: rutgonlink.site
          NEXTAUTH_SECRET: ci-build-placeholder
          ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: rutgonlink-cpanel-${{ github.sha }}
          path: ${{ runner.temp }}/rutgonlink-cpanel-${{ github.sha }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy production
    needs: test-build
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout deployment scripts
        uses: actions/checkout@v4

      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: rutgonlink-cpanel-${{ github.sha }}
          path: release

      - name: Publish temporary release asset
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET: release/rutgonlink-cpanel-${{ github.sha }}.tar.gz
        run: |
          tag="deploy-${GITHUB_SHA}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "$ASSET" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" "$ASSET" --repo "$GITHUB_REPOSITORY" --title "Deployment $GITHUB_SHA" --notes "Temporary CI deployment asset" --latest=false
          fi

      - name: Deploy through cPanel API
        env:
          CPANEL_URL: ${{ secrets.CPANEL_URL }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
          RELEASE_ASSET_URL: https://github.com/${{ github.repository }}/releases/download/deploy-${{ github.sha }}/rutgonlink-cpanel-${{ github.sha }}.tar.gz
          RELEASE_SCRIPT_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/scripts/cpanel-release.sh
        run: bash scripts/cpanel-deploy.sh "release/rutgonlink-cpanel-${GITHUB_SHA}.tar.gz" "${GITHUB_SHA}" "$RELEASE_ASSET_URL" "$RELEASE_SCRIPT_URL"

      - name: Verify production routes
        run: |
          curl --fail --silent --show-error --max-time 20 https://rutgonlink.site/ >/dev/null
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' https://rutgonlink.site/api/popups)" = 401
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' https://rutgonlink.site/api/posts)" = 401
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' https://rutgonlink.site/api/settings/telegram)" = 401
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 20 --request POST --header 'Content-Type: application/json' --data '{"url":"https://example.com/article"}' https://rutgonlink.site/api/content/resolve-video)" = 401
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 20 --request POST --data 'upload-auth-probe' https://rutgonlink.site/api/content/upload)" = 401
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' https://rutgonlink.site/api/admin/users)" = 403
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' https://rutgonlink.site/api/admin/users/anonymous-probe)" = 403
          curl --fail --silent --show-error --max-time 20 https://rutgonlink.site/chinh-sach-bao-mat >/dev/null
          dashboard_status="$(curl --silent --output /dev/null --write-out '%{http_code}' https://rutgonlink.site/dashboard/posts)"
          test "$dashboard_status" = 302 || test "$dashboard_status" = 307
          if [ -n "${SMOKE_POST_URL:-}" ]; then
            test "$(curl --silent --output /dev/null --write-out '%{http_code}' "$SMOKE_POST_URL")" = 200
          fi
          if [ -n "${SMOKE_SHORT_URL:-}" ]; then
            short_status="$(curl --silent --output /dev/null --write-out '%{http_code}' "$SMOKE_SHORT_URL")"
            test "$short_status" = 200 || test "$short_status" = 302
          fi

        env:
          SMOKE_POST_URL: ${{ secrets.SMOKE_POST_URL }}
          SMOKE_SHORT_URL: ${{ secrets.SMOKE_SHORT_URL }}

      - name: Remove temporary release asset
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete "deploy-${GITHUB_SHA}" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
